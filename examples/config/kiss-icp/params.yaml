odometry_node:
  pointcloud_topic: "/velodyne_points"          # Fill this or remap in the launch file
  publish_odom_tf: false        # Example default value
  visualize: false              # Example default value

  # KISS-ICP parameters
  max_range: 60.0               # Example default, replace with your actual value
  min_range: 2.0                # Example default
  deskew: true                  # Example default
  voxel_size: 0.1               # Example default
  max_points_per_voxel: 20
  initial_threshold: 2.0
  min_motion_th: 0.1