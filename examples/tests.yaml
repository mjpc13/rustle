test_definitions:

  #Runs the normal algorithms in the dataset
  - name: "simple"
    workers: 1
    iterations: 5
    algo_list: ["a-loam", "ig-LIO", "point-lio"]
    dataset_name: "botanic_garden"
    test_type:
      type: simple

  #Runs the dataset and increases the speed of the dataset in successive iterations
  # Tests how algorithms behave when they are time-constrained. It can also estimates how much time
  # the algorithm takes in average to process a frame;
  - name: "speed"
    workers: 1
    iterations: 1
    algo_list: ["ig-LIO", "point-lio"]
    dataset_name: "botanic_garden"
    test_type:
      type: speed
      speed_range: 10
      speed_step: 1

  - name: "fast-or-faster?"
    workers: 1
    iterations: 5
    algo_list: ["fast-lio", "faster-lio"]
    dataset_name: "botanic_garden"
    test_type:
      type: speed
      speed_factors: [1.0, 10, 20, 30, 16, 32, 64, 100]

  # Disconnects sensors during a specified times and durations. Tests how robust the algorithms are 
  # to sensor drop-outs. Can be used to test how several components of a multi-sensor algorithm 
  # behave, for e.g. Testing a LVI and disconnect the camera/lidar to check if the method 
  # still produces estimates and how reliable they are.
  - name: "cut-test"
    workers: 1
    iterations: 1
    algo_list: ["faster-lio", "point-lio"]
    dataset_name: "botanic_garden"
    test_type:
      type: cut
      cut_list:  # Can add N sensors. Types of sensors are: imu, lidar, radar, camera, gps
          - sensor: imu
            topic: "/imu/data"
            active_periods:
              - start_time: 30
                duration: 5
          - sensor: lidar
            topic: "/velodyne_points"
            active_periods:
              - start_time: 60
                duration: 5


  # Similar to the CUT test but just reduces the amount of messages received for the specified 
  # times and durations. 
  - name: "ig-drop"
    workers: 1
    iterations: 1
    algo_list: ["ig-LIO"]
    dataset_name: "botanic_garden"
    test_type:
      type: drop
      drop_list:  # Can add N sensors. Types of sensors are: imu, lidar, radar, camera, gps
          - sensor: imu
            drop_rate: [5,10] #Drop 5 message every 10 messages
            topic: "/livox/imu"
            active_periods:
              - start_time: 30
                duration: 5
              - start_time: 80
                duration: 5
          - sensor: lidar
            drop_rate: [1,10] #Drop 1 message every 10 messages
            topic: "/livox/lidar"
            active_periods:
              - start_time: 50
                duration: 5
              - start_time: 100
                duration: 5