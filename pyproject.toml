[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neorustle"
version = "0.1.0"
description = "A CLI tool to orchestrate and benchmark ROS SLAM algorithms."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "docker>=6.1.0",
    "psutil>=5.9.0",
    "numpy>=2.5.0",
    "rosbags>=0.11.0",
    "evo",
]

[project.scripts]
slam-bench = "slam_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/slam_bench"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = ["src"]
